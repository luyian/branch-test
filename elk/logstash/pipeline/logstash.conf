input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => {
      "message" => "(?m)%{TIMESTAMP_ISO8601:log_time} \[%{DATA:thread_name}\] %{LOGLEVEL:log_level}\s+\[%{DATA:trace_id}\] %{DATA:logger_name} - %{GREEDYDATA:log_message}"
    }
    tag_on_failure => ["_test_app_grok_failure"]
  }

  if [log_time] {
    date {
      match => ["log_time", "yyyy-MM-dd HH:mm:ss.SSS"]
      timezone => "Asia/Shanghai"
      target => "@timestamp"
    }
  }

  if [log_message] {
    mutate {
      replace => {
        "message" => "%{log_message}"
      }
    }
  }

  mutate {
    remove_field => ["log_time", "log_message", "agent", "ecs", "input"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "test-app-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
